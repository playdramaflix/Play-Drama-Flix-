name: Build & Release PlayDramaFlix APK

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Secrets and Env Files
        run: |
          touch .env
          touch .env.example
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p apk_output
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} apk_output/PlayDramaFlix-latest.apk \;
          echo "APK successfully created at apk_output/PlayDramaFlix-latest.apk"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayDramaFlix-APK
          path: apk_output/PlayDramaFlix-latest.apk
          retention-days: 30

      - name: Create GitHub Release (Optional for Tags & Manual Runs)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "PlayDramaFlix Android App"
          tag_name: ${{ github.ref_name || 'latest-build' }}
          draft: false
          prerelease: false
          files: apk_output/PlayDramaFlix-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

