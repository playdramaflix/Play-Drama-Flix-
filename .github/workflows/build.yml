name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Dummy Secrets File
      run: |
        touch .env
        touch .env.example

    - name: Setup Gradle Wrapper
      run: |
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x ./gradlew

    - name: Build APK without Configuration Cache
      run: ./gradlew assembleDebug --no-configuration-cache --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PlayDramaFlix-App
        path: app/build/outputs/apk/debug/*.apk
